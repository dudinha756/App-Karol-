name: Bootstrap App Karol

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"
      - ".bootstrap/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part1.b64 .bootstrap/part2.b64 .bootstrap/part3.b64 .bootstrap/part4.b64 > bundle.b64
          base64 --decode bundle.b64 > bundle.zip
          rm -rf .unpack
          mkdir .unpack
          unzip -q bundle.zip -d .unpack
          cp -a .unpack/app-karol/. .
          rm -rf .bootstrap .unpack bundle.b64 bundle.zip

      - name: Commit webapp source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: publish App Karol webapp source [skip ci]"
          git push
